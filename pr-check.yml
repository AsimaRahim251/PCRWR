# PCRWR Portal — PR quality gate
# Har PR pe chalega (team parts merge se pehle)
name: PR Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  check:
    name: PR Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build must pass
        run: npm run build

      - name: Comment on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Build failed.** Please fix errors before merging. Check the Actions log for details.'
            })
